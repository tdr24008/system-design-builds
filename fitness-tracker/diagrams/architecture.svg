<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="560" fill="#0E0E10" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#FF5A1F" letter-spacing="0.08em">PULSE — SYSTEM ARCHITECTURE</text>

  <!-- ── Client ── -->
  <rect x="30" y="70" width="170" height="420" rx="14" fill="#1A1A1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="0.06em">CLIENT</text>

  <rect x="50" y="115" width="130" height="38" rx="8" fill="#222227" stroke="rgba(255,90,31,0.4)" stroke-width="1"/>
  <text x="115" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#FF5A1F">React + Vite</text>

  <rect x="50" y="165" width="130" height="38" rx="8" fill="#222227" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="115" y="182" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">api.ts</text>
  <text x="115" y="196" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">fetch + X-User-Id</text>

  <rect x="50" y="215" width="130" height="38" rx="8" fill="#222227" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="115" y="232" text-anchor="middle" font-size="11" fill="#3B82F6">IndexedDB Outbox</text>
  <text x="115" y="246" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">db.ts — offline queue</text>

  <rect x="50" y="265" width="130" height="68" rx="8" fill="#222227" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="285" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.5)">Screens</text>
  <text x="115" y="300" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">Home / Log / Detail</text>
  <text x="115" y="315" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">Feed / Profile</text>

  <!-- ── Vite proxy label ── -->
  <text x="222" y="192" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">/v1 proxy</text>

  <!-- Arrow: client → API -->
  <line x1="181" y1="190" x2="285" y2="190" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="285" y1="200" x2="181" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- ── FastAPI ── -->
  <rect x="295" y="70" width="200" height="420" rx="14" fill="#1A1A1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="395" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="0.06em">BACKEND</text>

  <rect x="315" y="115" width="160" height="38" rx="8" fill="#222227" stroke="rgba(255,90,31,0.4)" stroke-width="1"/>
  <text x="395" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#FF5A1F">FastAPI 0.115</text>
  <text x="395" y="147" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">Python 3.11 · async</text>

  <rect x="315" y="165" width="160" height="28" rx="6" fill="#1D1D22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="183" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">POST /v1/workouts  (LWW upsert)</text>

  <rect x="315" y="200" width="160" height="28" rx="6" fill="#1D1D22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="218" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">POST /v1/sync  (batch delta)</text>

  <rect x="315" y="235" width="160" height="28" rx="6" fill="#1D1D22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="253" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">GET  /v1/feed  (hybrid push/pull)</text>

  <rect x="315" y="270" width="160" height="28" rx="6" fill="#1D1D22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="288" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">GET  /v1/users/{`{id}`}/stats</text>

  <rect x="315" y="305" width="160" height="28" rx="6" fill="#1D1D22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="323" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">POST/DELETE /v1/follows</text>

  <rect x="315" y="345" width="160" height="48" rx="8" fill="#222227" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="395" y="364" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.5)">fanout.py</text>
  <text x="395" y="379" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">asyncio background task</text>
  <text x="395" y="393" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)">push ≤ 10k followers | pull-on-read</text>

  <rect x="315" y="405" width="160" height="38" rx="8" fill="#222227" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="395" y="423" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.5)">blob_store.py</text>
  <text x="395" y="437" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">LocalBlobStore (S3-swappable)</text>

  <!-- Arrow: API → Postgres -->
  <line x1="496" y1="240" x2="590" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: API → Redis -->
  <line x1="496" y1="370" x2="590" y2="370" stroke="rgba(59,130,246,0.5)" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Arrow: API → BlobStore -->
  <line x1="496" y1="424" x2="590" y2="424" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arr-dim)"/>

  <!-- ── Data stores ── -->
  <rect x="600" y="70" width="270" height="420" rx="14" fill="#1A1A1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="735" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="0.06em">DATA STORES</text>

  <!-- Postgres -->
  <rect x="618" y="115" width="234" height="200" rx="10" fill="#222227" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="735" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.9)">PostgreSQL 15</text>

  <text x="630" y="160" font-size="10" fill="rgba(255,255,255,0.55)">users(id UUID, handle, display_name)</text>
  <text x="630" y="177" font-size="10" fill="rgba(255,255,255,0.55)">follows(follower_id, followee_id)</text>
  <text x="630" y="194" font-size="10" fill="rgba(255,90,31,0.9)">workouts(id UUID ← client-generated)</text>
  <text x="630" y="208" font-size="10" fill="rgba(255,255,255,0.35)">  + client_updated_at · version · deleted</text>
  <text x="630" y="224" font-size="10" fill="rgba(255,255,255,0.55)">workout_samples PARTITION BY RANGE(ts)</text>
  <text x="630" y="238" font-size="10" fill="rgba(255,255,255,0.35)">  monthly partitions, current + next</text>
  <text x="630" y="254" font-size="10" fill="rgba(255,255,255,0.55)">goals · personal_records</text>
  <text x="630" y="269" font-size="10" fill="rgba(255,255,255,0.35)">Alembic migrations</text>
  <text x="630" y="285" font-size="10" fill="rgba(255,255,255,0.35)">SQLAlchemy 2.x + asyncpg</text>
  <text x="630" y="302" font-size="10" fill="rgba(255,255,255,0.35)">indexes: (user_id, server_updated_at)</text>

  <!-- Redis -->
  <rect x="618" y="328" width="234" height="80" rx="10" fill="#222227" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="735" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#3B82F6">Redis 7</text>
  <text x="630" y="368" font-size="10" fill="rgba(255,255,255,0.55)">feed:{`{user_id}`} ZSET scored by ts</text>
  <text x="630" y="384" font-size="10" fill="rgba(255,255,255,0.35)">14-day TTL · push fan-out only</text>
  <text x="630" y="400" font-size="10" fill="rgba(255,255,255,0.35)">  for authors &lt; FANOUT_THRESHOLD</text>

  <!-- BlobStore -->
  <rect x="618" y="420" width="234" height="52" rx="10" fill="#222227" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="735" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)">BlobStore</text>
  <text x="630" y="459" font-size="10" fill="rgba(255,255,255,0.35)">./data/blobs  (LocalBlobStore → S3)</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.3)"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.15)"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(59,130,246,0.6)"/>
    </marker>
  </defs>

  <!-- Scale note -->
  <text x="450" y="510" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.2)">
    Design target: ~1M MAU · 100k DAU · 200k workouts/day · eventual consistency for feed · strong consistency for own log
  </text>
</svg>
